<div class="home-wrapper">
    <header class="top-bar">
        <div class="server-status-pill">
            <div class="status-dot online"></div>
            <div class="server-info">
                <span class="server-name">Valerium</span>
                <span class="player-count-text"><span class="count-val">0</span> Joueurs</span>
            </div>
        </div>
        
        <div class="social-top">
            <div data-url="https://discord.gg/bPNRwh6b" class="social-icon discord"></div>
            <div data-url="https://twitter.com/votrelien" class="social-icon twitter"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="news-container">
            <h3>Dernières Annonces</h3>
            <div class="news-list custom-scroll">
                </div>
        </div>
    </main>

    <footer class="bottom-dock">
        <div class="info-starting-game">
            <span class="info-starting-game-text">Initialisation...</span>
            <progress value="0" max="100" class="progress-bar"></progress>
        </div>

        <div class="play-elements">
            <div class="dock-group left">
                <button class="settings-btn icon-settings" title="Paramètres"></button>
            </div>

            <div class="dock-group center">
                <button class="play-btn">
                    <span>JOUER</span>
                    <div class="play-shine"></div>
                </button>
            </div>

            <div class="dock-group right">
                <div class="instance-select">
                    <span class="selected-instance-name">Selection</span>
                    <i class="icon-arrow"></i>
                </div>
            </div>
        </div>
    </footer>

    <div class="instance-popup">
        <div class="popup-card">
            <div class="popup-header">
                <h4>Choisir une version</h4>
                <div class="close-popup icon-close">×</div>
            </div>
            <div class="instances-List custom-scroll"></div>
        </div>
    </div>
</div>
